name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libfontconfig1 libglu1-mesa libxcursor1 libxinerama1 libxft2 calculix-ccx
      - run: python -m pip install -e ".[dev,app,fem]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src tests
      - run: pytest --cov --cov-report=term-missing
